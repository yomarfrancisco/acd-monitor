[pytest]
pythonpath = . src
addopts = -ra -p no:faulthandler
testpaths = tests
markers =
    micro: fast acceptance checks for e2e preview
norecursedirs = tests/agent tests/benchmarks tests/data tests/demo tests/evidence tests/phase1 tests/phase2 tests/phase3 tests/vmm
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
