name: CI OIDC Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ci_oidc_probe.yml"
      - "scripts/ops/create_ci_oidc_role.py"

permissions:
  id-token: write
  contents: read

jobs:
  oidc-probe:
    name: OIDC Probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/acd-ci-oidc
          aws-region: us-east-1

      - name: Test STS identity
        run: |
          echo "🔍 Testing OIDC role assumption..."
          aws sts get-caller-identity
          
          echo "📋 Role details:"
          aws iam get-role --role-name acd-ci-oidc --query 'Role.{RoleName:RoleName,Arn:Arn,CreateDate:CreateDate}'
          
          echo "📋 Attached policies:"
          aws iam list-attached-role-policies --role-name acd-ci-oidc

      - name: Test S3 access (read-only)
        run: |
          echo "🔍 Testing S3 read access..."
          aws s3 ls s3://acd-monitor-snapshots/ --max-items 5
          
          echo "📊 S3 bucket info:"
          aws s3api get-bucket-location --bucket acd-monitor-snapshots

      - name: Test Athena access
        run: |
          echo "🔍 Testing Athena access..."
          aws athena list-work-groups --query 'WorkGroups[?Name==`acd-analytics`]'
          
          echo "📋 Available workgroups:"
          aws athena list-work-groups --query 'WorkGroups[].{Name:Name,State:State}'

      - name: Test Glue access
        run: |
          echo "🔍 Testing Glue access..."
          aws glue get-databases --query 'DatabaseList[?Name==`acd_snapshots`]'
          
          echo "📋 Available databases:"
          aws glue get-databases --query 'DatabaseList[].{Name:Name,Description:Description}'

      - name: OIDC Probe Summary
        run: |
          echo "✅ OIDC probe completed successfully!"
          echo "🎯 Role assumption: Working"
          echo "🔐 S3 read access: Working" 
          echo "📊 Athena access: Working"
          echo "🗄️ Glue access: Working"
