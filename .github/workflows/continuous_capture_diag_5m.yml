name: Continuous Snapshot Capture - 5min Diagnostic

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols (comma-separated)"
        required: true
        default: "BTC-USD,ETH-USD"
      venues:
        description: "Venues (comma-separated) — exclude binance"
        required: true
        default: "coinbase,kraken,okx,bybit"
      canary:
        description: "Enable canary mode"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

# Diagnostic concurrency - do NOT auto-cancel
concurrency:
  group: capture-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ACD_S3_BUCKET: acd-monitor-snapshots
  ACD_S3_PREFIX: snapshots
  BTC_CANARY_ENABLED: true  # Always enable canary for diagnostic
  BTC_SANITY_MIN_2025: "80000"

jobs:
  capture-windows-diagnostic:
    # 10-minute timeout for 5-minute capture + writes
    timeout-minutes: 10

    runs-on: ubuntu-latest

    # Only run on main branch
    if: ${{ github.ref == 'refs/heads/main' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit SHA
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3 pandas pyarrow requests
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::514258695205:role/acd-ci-oidc
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Sanity check AWS connectivity
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://${{ env.ACD_S3_BUCKET }}/${{ env.ACD_S3_PREFIX }}/ || echo "Bucket empty or doesn't exist yet"
      
      - name: Diagnostic 5-minute capture
        run: |
          set -euxo pipefail
          
          # Calculate 5-minute diagnostic window
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # start = floor to prior minute to avoid future start
          START_EPOCH=$(date -u +%s)
          START_EPOCH=$(( START_EPOCH - (START_EPOCH % 60) ))         # floor to minute
          WINDOW_START=$(date -u -d "@${START_EPOCH}" +"%Y-%m-%dT%H:%M:%SZ")
          WINDOW_END=$(date -u -d "@$((START_EPOCH + 300))" +"%Y-%m-%dT%H:%M:%SZ")   # +300s = 5m
          
          echo "Diagnostic window: ${WINDOW_START} → ${WINDOW_END}"
          
          # Set up log capture
          LOG="${{ runner.temp }}/capture.log"
          : > "$LOG"
          echo "Starting diagnostic capture and tee-ing logs to $LOG"
          
          # Capture each symbol
          IFS=',' read -ra SYMBOLS <<< "${{ github.event.inputs.symbols }}"
          for symbol in "${SYMBOLS[@]}"; do
            echo "=== DIAGNOSTIC CAPTURE: $symbol ==="
            python scripts/capture/capture_window_enhanced.py \
              --symbol "$symbol" \
              --start "$WINDOW_START" \
              --end "$WINDOW_END" \
              --venues "${{ github.event.inputs.venues }}" \
              --bucket "${{ env.ACD_S3_BUCKET }}" \
              --prefix "${{ env.ACD_S3_PREFIX }}" \
              --canary \
              --verbose | tee -a "$LOG"
            echo "=== COMPLETED: $symbol ==="
          done
      
      - name: Verify diagnostic completion
        run: |
          set -euo pipefail
          LOG="${{ runner.temp }}/capture.log"
          echo "🔍 Checking diagnostic markers in $LOG"
          grep -q "S3_WRITE_COMPLETE" "$LOG" && echo "::notice title=Marker Found::S3_WRITE_COMPLETE"
          grep -q "CAPTURE_COMPLETE" "$LOG" && echo "::notice title=Marker Found::CAPTURE_COMPLETE"
          grep -q "WINDOW_CAPTURE_COMPLETE" "$LOG" && echo "::notice title=Marker Found::WINDOW_CAPTURE_COMPLETE"

          # Fail clearly if any are missing
          for m in S3_WRITE_COMPLETE CAPTURE_COMPLETE WINDOW_CAPTURE_COMPLETE; do
            if ! grep -q "$m" "$LOG"; then
              echo "::error title=Missing Marker::$m not found in logs"
              exit 1
            fi
          done
      
      - name: Verify S3 diagnostic output
        run: |
          set -euo pipefail
          # Calculate the same window as the capture step
          START_EPOCH=$(date -u +%s)
          START_EPOCH=$(( START_EPOCH - (START_EPOCH % 60) ))
          WINDOW_START=$(date -u -d "@${START_EPOCH}" +"%Y-%m-%dT%H:%M:%SZ")
          WINDOW_END=$(date -u -d "@$((START_EPOCH + 300))" +"%Y-%m-%dT%H:%M:%SZ")
          
          DATE_UTC=$(date -u +%Y%m%d)
          START_HM=$(date -u -d "$WINDOW_START" +%H%M)
          END_HM=$(date -u -d "$WINDOW_END" +%H%M)
          PREFIX="snapshots/BTC-USD/$DATE_UTC/${START_HM}-${END_HM}"
          echo "🔍 Checking s3://${{ env.ACD_S3_BUCKET }}/$PREFIX/"
          aws s3 ls "s3://${{ env.ACD_S3_BUCKET }}/$PREFIX/" || (echo "::error::S3 window folder missing" && exit 1)
      
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-capture-logs-${{ github.run_id }}
          path: |
            **/logs/**
            **/reports/**
          retention-days: 3
      
      - name: Diagnostic summary
        if: always()
        run: |
          echo "=== DIAGNOSTIC SUMMARY ==="
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Symbols: ${{ github.event.inputs.symbols }}"
          echo "Venues: ${{ github.event.inputs.venues }}"
          echo "Canary Mode: ${{ github.event.inputs.canary }}"
          echo "Status: ${{ job.status }}"
