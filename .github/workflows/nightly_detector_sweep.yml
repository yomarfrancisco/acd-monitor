name: Nightly Detector Sweep

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      hours_back:
        description: 'Hours to look back for windows'
        required: false
        default: '24'
      detectors:
        description: 'Detectors to run (comma-separated)'
        required: false
        default: 'spread_v2,leadlag_v2,infoshare_v2'

env:
  AWS_REGION: us-east-1
  ACD_S3_BUCKET: acd-monitor-snapshots
  ACD_S3_PREFIX: snapshots

jobs:
  nightly-sweep:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3 pandas pyarrow requests scipy statsmodels
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Sanity check AWS connectivity
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://${{ env.ACD_S3_BUCKET }}/${{ env.ACD_S3_PREFIX }}/ || echo "Bucket empty or doesn't exist yet"
      
      - name: Run nightly detector sweep
        run: |
          set -euxo pipefail
          
          # Set parameters
          HOURS_BACK="${{ github.event.inputs.hours_back || '24' }}"
          DETECTORS="${{ github.event.inputs.detectors || 'spread_v2,leadlag_v2,infoshare_v2' }}"
          
          echo "Running nightly detector sweep"
          echo "Hours back: $HOURS_BACK"
          echo "Detectors: $DETECTORS"
          
          python scripts/detectors/nightly_sweep.py \
            --bucket "${{ env.ACD_S3_BUCKET }}" \
            --prefix "${{ env.ACD_S3_PREFIX }}" \
            --hours-back "$HOURS_BACK" \
            --detectors $DETECTORS \
            --verbose
      
      - name: Upload sweep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-sweep-logs-${{ github.run_id }}
          path: |
            **/logs/**
            **/reports/**
          retention-days: 7
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Nightly detector sweep failed for run ${{ github.run_number }}"
          echo "Check logs in artifacts for details"