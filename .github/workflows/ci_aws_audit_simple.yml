name: CI AWS Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ci_aws_audit_simple.yml"
      - "scripts/ops/ci_audit_*.py"

permissions:
  contents: read

concurrency:
  group: ci-aws-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install boto3 pyarrow pandas
      - name: Env audit
        run: python scripts/ops/ci_audit_env.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET: acd-monitor-snapshots
      - name: Parquet audit
        run: python scripts/ops/ci_audit_parquet.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET: acd-monitor-snapshots
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-aws-audit-${{ github.sha }}
          path: analysis/infra/CI_AUDIT/**
