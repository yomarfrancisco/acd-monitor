name: E2E Verify & Promote

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]

jobs:
  e2e-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -V
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
      
      - name: Smoke test scientific stack
        run: |
          python - <<'PY'
          import numpy, pandas, scipy, statsmodels
          from statsmodels.tsa.vector_ar.vecm import VECM, coint_johansen
          print("scientific stack OK")
          PY
      
      - name: Check Makefile whitespace
        run: |
          sed -n '55,75p' Makefile | nl -ba
          make -n test
      
      - name: Run unit tests (micro fast)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q --maxfail=1 -x \
            tests/test_inclusive_end_date.py \
            tests/test_resample_minute_second.py \
            tests/test_leadlag_invariant.py \
            tests/test_infoshare_bounds_schema.py
      
      - name: Run experiment smoke test
        run: |
          python experiments/run_experiment.py --snapshot baselines/2s --modules leadlag,infoshare,spread --notes "CI smoke"
          # Verify experiment output exists
          if [ ! -f experiments/out/*/summary.json ]; then
            echo "[EXPERIMENT:FAIL] No summary.json found"
            exit 1
          fi
          # Check required keys in summary.json
          python -c "
          import json, glob
          summary_files = glob.glob('experiments/out/*/summary.json')
          if not summary_files:
              print('[EXPERIMENT:FAIL] No summary files found')
              exit(1)
          with open(summary_files[0]) as f:
              data = json.load(f)
          required_keys = ['timestamp', 'snapshot', 'modules', 'metrics']
          missing = [k for k in required_keys if k not in data]
          if missing:
              print(f'[EXPERIMENT:FAIL] Missing keys: {missing}')
              exit(1)
          print('[EXPERIMENT:PASS] Summary.json has required keys')
          "
      
      - name: Create minimal test snapshot
        run: |
          set -euo pipefail
          mkdir -p test_snapshot/ticks
          # Create minimal test data structure
          echo '{"startUTC":"2025-09-26T20:48:04Z","endUTC":"2025-09-26T20:57:52Z","venues":["binance","coinbase"],"policy":"TEST_2s"}' > test_snapshot/OVERLAP.json
      
      - name: Create baselines symlink
        run: |
          set -euo pipefail
          mkdir -p artifacts/baselines
          # Link artifacts/baselines/2s -> baselines/2s (two-levels up inside artifacts)
          ln -sf ../../baselines/2s artifacts/baselines/2s
      
      - name: E2E verify baseline
        run: |
          set -euo pipefail
          if python scripts/build_research_baseline_2s.py \
               --baseline-dir artifacts/baselines/2s \
               --export-dir artifacts/baselines/2s/evidence \
               --verbose; then
            echo "✅ Baseline evidence built."
          else
            echo "⚠️ No ticks / InfoShare failed; writing stub evidence for snapshot-only mode."
            mkdir -p artifacts/baselines/2s/evidence
            printf '{}' > artifacts/baselines/2s/evidence/info_share_results.json
            printf '{}' > artifacts/baselines/2s/evidence/spread_results.json
          fi
      
      - name: Verify snapshot wiring
        run: |
          set -euo pipefail
          test -f test_snapshot/OVERLAP.json
          test -d artifacts/baselines/2s/evidence
          echo "[E2E:PASS] Snapshot wiring verified"
      
      - name: Verify bundles
        run: |
          make verify-bundles
      
      - name: Update promotion pointers
        run: |
          python scripts/update_promotion_pointers.py
      
      - name: Acceptance checks
        run: |
          set -euo pipefail
          echo "[ACCEPTANCE:check] Verifying promotion pointers and manifests"
          if [ -f "exports/sweep/REAL_2s_PROMOTED.json" ]; then
            echo "[ACCEPTANCE:file] REAL_2s_PROMOTED.json found"
            ls -la exports/sweep/REAL_2s_PROMOTED.json
            sha256sum exports/sweep/REAL_2s_PROMOTED.json
          else
            echo "REAL_2s_PROMOTED.json not found"
          fi
          if [ -f "artifacts/baselines/2s/MANIFEST.json" ]; then
            echo "[ACCEPTANCE:file] MANIFEST.json found"
            ls -la artifacts/baselines/2s/MANIFEST.json
            sha256sum artifacts/baselines/2s/MANIFEST.json
          else
            echo "MANIFEST.json not found"
          fi
          echo "[ACCEPTANCE:done] $(git rev-parse --short HEAD) - Step 5 verified ✅"
      
      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-artifacts
          path: |
            test_snapshot/evidence/
            artifacts/baselines/2s/evidence/
          if-no-files-found: error
          retention-days: 7
