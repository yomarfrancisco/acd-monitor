name: Daily Health Report

on:
  schedule:
    # Run every morning at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Symbols to analyze (comma-separated)'
        required: false
        default: 'BTC-USD,ETH-USD'
      days_back:
        description: 'Number of days to look back'
        required: false
        default: '1'

env:
  AWS_REGION: us-east-1
  ACD_S3_BUCKET: acd-monitor-snapshots
  ACD_S3_PREFIX: snapshots

jobs:
  daily-health-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3 pandas pyarrow
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set report parameters
        id: report_params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "symbols=${{ github.event.inputs.symbols }}" >> $GITHUB_OUTPUT
            echo "days_back=${{ github.event.inputs.days_back }}" >> $GITHUB_OUTPUT
          else
            echo "symbols=BTC-USD,ETH-USD" >> $GITHUB_OUTPUT
            echo "days_back=1" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate daily health report
        run: |
          set -euxo pipefail
          
          echo "Generating daily health report..."
          
          python scripts/ops/daily_health_report.py \
            --symbols ${{ steps.report_params.outputs.symbols }} \
            --days-back ${{ steps.report_params.outputs.days_back }} \
            --bucket ${{ env.ACD_S3_BUCKET }} \
            --prefix ${{ env.ACD_S3_PREFIX }} \
            --output reports/daily_status.json \
            --verbose
      
      - name: Check budget alert
        id: budget_check
        run: |
          set -euxo pipefail
          
          daily_cost=$(python -c "
          import json
          with open('reports/daily_status.json', 'r') as f:
              report = json.load(f)
          print(report.get('cost_estimate', {}).get('total_daily_cost', 0))
          ")
          
          echo "daily_cost=$daily_cost" >> $GITHUB_OUTPUT
          
          if (( $(echo "$daily_cost > 20" | bc -l) )); then
            echo "budget_alert=true" >> $GITHUB_OUTPUT
            echo "⚠️ BUDGET ALERT: Daily cost $${daily_cost} exceeds $20 threshold!"
          else
            echo "budget_alert=false" >> $GITHUB_OUTPUT
            echo "✅ Daily cost $${daily_cost} within budget"
          fi
      
      - name: Upload report to S3
        run: |
          set -euxo pipefail
          
          echo "Uploading daily health report to S3..."
          
          # Upload to S3
          aws s3 cp reports/daily_status.json s3://${{ env.ACD_S3_BUCKET }}/reports/daily_status.json
          aws s3 cp reports/daily_status.md s3://${{ env.ACD_S3_BUCKET }}/reports/daily_status.md
          
          echo "Report uploaded successfully"
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-health-report-${{ github.run_number }}
          path: |
            reports/daily_status.json
            reports/daily_status.md
          retention-days: 30
      
      - name: Create GitHub issue on budget alert
        if: steps.budget_check.outputs.budget_alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const dailyCost = '${{ steps.budget_check.outputs.daily_cost }}';
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Budget Alert: Daily cost $${dailyCost} exceeds $20 threshold`,
              body: `## Budget Alert
              
              **Daily Cost**: $${dailyCost}
              **Threshold**: $20
              **Excess**: $${(dailyCost - 20).toFixed(2)}
              
              Please review storage usage and consider:
              - S3 lifecycle policies
              - Data retention settings
              - Cost optimization measures
              
              Generated by: ${{ github.workflow }} #${{ github.run_number }}`
            });
            console.log(`Created issue #${issue.data.number}`);
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Daily health report failed for run ${{ github.run_number }}"
          echo "Check logs and artifacts for details"
