name: Snapshot Verify

on: 
  workflow_dispatch:
  push:
    branches: [main, preview]
    paths: ['scripts/snapshots/**', '.github/workflows/snapshot_verify.yml']

jobs:
  verify-snapshot:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ACD_S3_BUCKET: acd-monitor-snapshots
      ACD_S3_PREFIX: snapshots
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Verify snapshot
        run: |
          make verify-snapshot SYMBOL=BTC-USD DATE=20250928 SPAN=0200-0230
          
      - name: List S3 contents (debug)
        run: |
          aws s3 ls s3://acd-monitor-snapshots/snapshots/BTC-USD/20250928/0200-0230/ --recursive
