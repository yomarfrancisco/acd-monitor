name: Snapshot Verify

on: 
  workflow_dispatch:
  push:
    branches: [main, preview]
    paths: ['scripts/snapshots/**', '.github/workflows/snapshot_verify.yml']

jobs:
  verify-snapshot:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      ACD_S3_BUCKET: acd-monitor-snapshots
      ACD_S3_PREFIX: snapshots
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Sanity AWS (whoami + ls bucket)
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://acd-monitor-snapshots/snapshots/ || true
          
      - name: Verify snapshot
        run: |
          make verify-snapshot SYMBOL=BTC-USD DATE=20250928 SPAN=0200-0230
          
      - name: List S3 contents (debug)
        run: |
          aws s3 ls s3://acd-monitor-snapshots/snapshots/BTC-USD/20250928/0200-0230/ --recursive
