name: Snapshot Verify

on: 
  workflow_dispatch:
  push:
    branches: [main, preview]
    paths: ['scripts/snapshots/**', '.github/workflows/snapshot_verify.yml']

jobs:
  verify-snapshot:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      ACD_S3_BUCKET: acd-monitor-snapshots
      ACD_S3_PREFIX: snapshots
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-verify.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install verify deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-verify.txt
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Sanity AWS (whoami + ls bucket)
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://acd-monitor-snapshots/ | head -5
          
      - name: Wait for S3 consistency
        run: sleep 5
        
      - name: Verify snapshot
        run: |
          python scripts/snapshots/verify_snapshot.py \
            --discover --fail-under-coverage 0.95 --report clocks,coverage --warn-on-quality
          
      - name: List S3 contents (debug)
        run: |
          aws s3 ls s3://acd-monitor-snapshots/snapshots/BTC-USD/20250928/0200-0230/ --recursive
