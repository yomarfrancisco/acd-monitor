name: Continuous Snapshot Capture

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Symbols to capture (comma-separated)'
        required: true
        default: 'BTC-USD,ETH-USD'
      venues:
        description: 'Venues to capture (comma-separated)'
        required: false
        default: 'coinbase,kraken,okx,bybit'  # Binance disabled: Enable only when WS proxy or non-geofenced runner is available
      canary_mode:
        description: 'Enable canary mode (writes to ticks_canary/)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

# Remove auto-cancel to prevent "Run+15 cancels Run" problem
concurrency:
  group: capture-continuous-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ACD_S3_BUCKET: acd-monitor-snapshots
  ACD_S3_PREFIX: snapshots
  BTC_CANARY_ENABLED: false
  BTC_SANITY_MIN_2025: "80000"

jobs:
  capture-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # ≥ capture window + S3 write buffer

    strategy:
      fail-fast: false
      matrix:
        symbol: ["BTC-USD", "ETH-USD"]  # Fixed matrix for reliability

    if: ${{ github.ref == 'refs/heads/main' }}
    
    steps:
      # 4) early kill switch if minutes are out (optional; just logs)
      - name: Check Actions minutes (log only)
        run: echo "If this job stays queued, verify org Actions minutes & spending limit."
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit SHA
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3 pandas pyarrow requests
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::514258695205:role/acd-ci-oidc
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Sanity check AWS connectivity
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://${{ env.ACD_S3_BUCKET }}/${{ env.ACD_S3_PREFIX }}/ || echo "Bucket empty or doesn't exist yet"
      
      - name: Set capture parameters
        id: capture_params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "venues=${{ github.event.inputs.venues }}" >> $GITHUB_OUTPUT
            echo "canary_mode=${{ github.event.inputs.canary_mode }}" >> $GITHUB_OUTPUT
          else
            echo "venues=coinbase,kraken,okx,bybit" >> $GITHUB_OUTPUT
            echo "canary_mode=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Workflow guards
        run: |
          echo "==== HEAD COMMIT ====" && git rev-parse HEAD
          echo "==== Grep parser version banner ===="
          grep -n 'CAPTURE_PARSER_VERSION' scripts/capture/websocket_capture.py || true

      - name: Capture window (${{ matrix.symbol }})
        run: |
          set -euxo pipefail
          
          # Calculate 30-minute window aligned to 15-minute boundaries
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          START_EPOCH=$(date -u +%s)
          START_EPOCH=$(( START_EPOCH - (START_EPOCH % 900) ))
          WINDOW_START=$(date -u -d "@${START_EPOCH}" +"%Y-%m-%dT%H:%M:%SZ")
          WINDOW_END=$(date -u -d "@$((START_EPOCH + 1800))" +"%Y-%m-%dT%H:%M:%SZ")
          
          echo "Capturing ${{ matrix.symbol }} from $WINDOW_START to $WINDOW_END"
          
          # Write window values to environment for verification steps
          echo "WINDOW_START=${WINDOW_START}" >> $GITHUB_ENV
          echo "WINDOW_END=${WINDOW_END}" >> $GITHUB_ENV
          
          LOG="${{ runner.temp }}/capture_${{ matrix.symbol }}.log"
          : > "$LOG"
          
          CANARY_FLAG=""
          if [ "${{ steps.capture_params.outputs.canary_mode }}" = "true" ]; then
            CANARY_FLAG="--canary"
          fi
          
          python scripts/capture/capture_window_enhanced.py \
            --symbol "${{ matrix.symbol }}" \
            --start "$WINDOW_START" \
            --end "$WINDOW_END" \
            --venues "${{ steps.capture_params.outputs.venues }}" \
            --bucket "${{ env.ACD_S3_BUCKET }}" \
            --prefix "${{ env.ACD_S3_PREFIX }}" \
            $CANARY_FLAG \
            --verbose | tee -a "$LOG"
      
      - name: Verify capture completion (${{ matrix.symbol }})
        run: |
          set -euo pipefail
          LOG="${{ runner.temp }}/capture_${{ matrix.symbol }}.log"
          echo "🔍 Checking completion markers in $LOG"
          for m in S3_WRITE_COMPLETE CAPTURE_COMPLETE WINDOW_CAPTURE_COMPLETE; do
            if ! grep -q "$m" "$LOG"; then
              echo "::error title=Missing Marker::$m not found in logs for ${{ matrix.symbol }}"
              exit 1
            fi
          done
          echo "::notice title=Markers OK::${{ matrix.symbol }}"
      
      - name: Verify S3 output (${{ matrix.symbol }})
        run: |
          set -euo pipefail
          # Use the exact window values from the capture step
          START_HM=$(date -u -d "${{ env.WINDOW_START }}" +%H%M)
          END_HM=$(date -u -d "${{ env.WINDOW_END }}" +%H%M)
          DATE_UTC=$(date -u -d "${{ env.WINDOW_START }}" +%Y%m%d)
          PREFIX="${{ env.ACD_S3_PREFIX }}/${{ matrix.symbol }}/$DATE_UTC/${START_HM}-${END_HM}"
          echo "🔍 Checking s3://${{ env.ACD_S3_BUCKET }}/$PREFIX/"
          aws s3 ls "s3://${{ env.ACD_S3_BUCKET }}/$PREFIX/" || (echo "::error::S3 window folder missing for ${{ matrix.symbol }}" && exit 1)
      
      - name: Quality gate (${{ matrix.symbol }})
        run: |
          set -euo pipefail
          # Use the exact window values from the capture step
          START_HM=$(date -u -d "${{ env.WINDOW_START }}" +%H%M)
          END_HM=$(date -u -d "${{ env.WINDOW_END }}" +%H%M)
          DATE_UTC=$(date -u -d "${{ env.WINDOW_START }}" +%Y%m%d)
          PREFIX="${{ env.ACD_S3_PREFIX }}/${{ matrix.symbol }}/$DATE_UTC/${START_HM}-${END_HM}"
          
          # Check coverage.json for quality gate
          COVERAGE_KEY="$PREFIX/meta/coverage.json"
          echo "🔍 Checking quality gate: s3://${{ env.ACD_S3_BUCKET }}/$COVERAGE_KEY"
          
          if aws s3 ls "s3://${{ env.ACD_S3_BUCKET }}/$COVERAGE_KEY" >/dev/null 2>&1; then
            COVERAGE_DATA=$(aws s3 cp "s3://${{ env.ACD_S3_BUCKET }}/$COVERAGE_KEY" - 2>/dev/null || echo "{}")
            if [ "$COVERAGE_DATA" != "{}" ]; then
              # Count venues with ≥95% coverage
              VENUES_OK=$(echo "$COVERAGE_DATA" | jq -r 'to_entries[] | select(.value.coverage_percentage >= 95) | .key' | wc -l)
              echo "📊 Coverage summary for ${{ matrix.symbol }}:"
              echo "$COVERAGE_DATA" | jq -r 'to_entries[] | "  \(.key): \(.value.coverage_percentage // "N/A")%"' 2>/dev/null || echo "  (Unable to parse coverage data)"
              
              if [ "$VENUES_OK" -lt 3 ]; then
                echo "❌ QUALITY_GATE_FAIL: venues_ok=$VENUES_OK/3, details in meta/coverage.json"
                exit 1
              else
                echo "✅ QUALITY_GATE_PASS: venues_ok=$VENUES_OK/3"
              fi
            else
              echo "❌ QUALITY_GATE_FAIL: No coverage data available"
              exit 1
            fi
          else
            echo "❌ QUALITY_GATE_FAIL: Coverage metadata missing"
            exit 1
          fi
      
      - name: Upload capture logs (${{ matrix.symbol }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-logs-${{ github.run_id }}-${{ matrix.symbol }}
          path: ${{ runner.temp }}/capture_${{ matrix.symbol }}.log
          retention-days: 7
      
      - name: Summary (${{ matrix.symbol }})
        if: always()
        run: |
          # Use the exact window values from the capture step
          START_HM=$(date -u -d "${{ env.WINDOW_START }}" +%H%M)
          END_HM=$(date -u -d "${{ env.WINDOW_END }}" +%H%M)
          DATE_UTC=$(date -u -d "${{ env.WINDOW_START }}" +%Y%m%d)
          PREFIX="${{ env.ACD_S3_PREFIX }}/${{ matrix.symbol }}/$DATE_UTC/${START_HM}-${END_HM}"
          
          # Try to get coverage summary for final report
          COVERAGE_KEY="$PREFIX/meta/coverage.json"
          if aws s3 ls "s3://${{ env.ACD_S3_BUCKET }}/$COVERAGE_KEY" >/dev/null 2>&1; then
            COVERAGE_DATA=$(aws s3 cp "s3://${{ env.ACD_S3_BUCKET }}/$COVERAGE_KEY" - 2>/dev/null || echo "{}")
            if [ "$COVERAGE_DATA" != "{}" ]; then
              VENUES_OK=$(echo "$COVERAGE_DATA" | jq -r 'to_entries[] | select(.value.coverage_percentage >= 95) | .key' | wc -l)
              COVERAGE_SUMMARY=$(echo "$COVERAGE_DATA" | jq -r 'to_entries[] | "\(.key):\(.value.coverage_percentage // "N/A")"' | tr '\n' ',' | sed 's/,$//')
              echo "SUMMARY ${{ matrix.symbol }}: venues_ok=$VENUES_OK/4, coverage={$COVERAGE_SUMMARY}"
            else
              echo "SUMMARY ${{ matrix.symbol }}: venues_ok=0/4, coverage={no_data}"
            fi
          else
            echo "SUMMARY ${{ matrix.symbol }}: venues_ok=0/4, coverage={missing_metadata}"
          fi
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Capture failed for ${{ matrix.symbol }} in run ${{ github.run_number }}"
          echo "Check logs in artifacts for details"
