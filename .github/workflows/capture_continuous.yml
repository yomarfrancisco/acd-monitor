name: Continuous Snapshot Capture

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Symbols to capture (comma-separated)'
        required: true
        default: 'BTC-USD,ETH-USD'
      venues:
        description: 'Venues to capture (comma-separated)'
        required: false
        default: 'binance,coinbase,kraken,okx,bybit'
      canary_mode:
        description: 'Enable canary mode (writes to ticks_canary/)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

# 1) ensure only one capture loop at a time AND auto-cancel older runs
concurrency:
  group: capture_continuous-${{ github.ref }}   # branch-specific
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ACD_S3_BUCKET: acd-monitor-snapshots
  ACD_S3_PREFIX: snapshots
  BTC_CANARY_ENABLED: false
  BTC_SANITY_MIN_2025: "80000"

jobs:
  capture-windows:
    # 2) put a hard cap on runaway runs
    timeout-minutes: 30

    runs-on: ubuntu-latest

    # 3) optional guard to only run on main
    if: ${{ github.ref == 'refs/heads/main' }}
    
    steps:
      # 4) early kill switch if minutes are out (optional; just logs)
      - name: Check Actions minutes (log only)
        run: echo "If this job stays queued, verify org Actions minutes & spending limit."
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit SHA
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3 pandas pyarrow requests
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::514258695205:role/acd-ci-oidc
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Sanity check AWS connectivity
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://${{ env.ACD_S3_BUCKET }}/${{ env.ACD_S3_PREFIX }}/ || echo "Bucket empty or doesn't exist yet"
      
      - name: Set capture parameters
        id: capture_params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "symbols=${{ github.event.inputs.symbols }}" >> $GITHUB_OUTPUT
            echo "venues=${{ github.event.inputs.venues }}" >> $GITHUB_OUTPUT
            echo "canary_mode=${{ github.event.inputs.canary_mode }}" >> $GITHUB_OUTPUT
          else
            echo "symbols=BTC-USD,ETH-USD" >> $GITHUB_OUTPUT
            echo "venues=binance,coinbase,kraken,okx,bybit" >> $GITHUB_OUTPUT
            echo "canary_mode=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Workflow guards
        run: |
          echo "==== HEAD COMMIT ====" && git rev-parse HEAD
          echo "==== Grep parser version banner ===="
          grep -n 'CAPTURE_PARSER_VERSION' scripts/capture/websocket_capture.py || true

      - name: Capture windows
        run: |
          set -euxo pipefail
          
          # Get current time and calculate window
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          WINDOW_START=$(date -u -d "@$(($(date -u +%s) / 900 * 900))" +"%Y-%m-%dT%H:%M:%SZ")
          WINDOW_END=$(date -u -d "@$(($(date -u +%s) / 900 * 900 + 1800))" +"%Y-%m-%dT%H:%M:%SZ")
          
          echo "Capturing windows from $WINDOW_START to $WINDOW_END"
          
          # Capture each symbol
          IFS=',' read -ra SYMBOLS <<< "${{ steps.capture_params.outputs.symbols }}"
          for symbol in "${SYMBOLS[@]}"; do
            echo "Capturing $symbol"
            CANARY_FLAG=""
            if [ "${{ steps.capture_params.outputs.canary_mode }}" = "true" ]; then
              CANARY_FLAG="--canary"
            fi
            python scripts/capture/capture_window_enhanced.py \
              --symbol "$symbol" \
              --start "$WINDOW_START" \
              --end "$WINDOW_END" \
              --venues "${{ steps.capture_params.outputs.venues }}" \
              --bucket "${{ env.ACD_S3_BUCKET }}" \
              --prefix "${{ env.ACD_S3_PREFIX }}" \
              $CANARY_FLAG \
              --verbose
          done
      
      - name: Verify captures
        run: |
          # Add small delay for S3 eventual consistency
          sleep 20
          bash .github/scripts/verify_snippet.sh
        continue-on-error: true  # non-blocking
      
      - name: Validate coverage + emit health metrics (WARN only)
        env:
          AWS_REGION: us-east-1
          ACD_S3_BUCKET: acd-monitor-snapshots
          ACD_S3_PREFIX: snapshots
          FAIL_ON_MISSING_COVERAGE: "false"   # flip to "true" after 48–72h
          SYMBOLS: "BTC-USD ETH-USD"
          VENUES: "binance coinbase kraken okx bybit"
        run: |
          set -euo pipefail
          echo "🔍 Validating coverage metadata generation..."
          
          # Check if coverage.json was created for each captured window
          IFS=' ' read -ra SYMBOLS <<< "$SYMBOLS"
          for symbol in "${SYMBOLS[@]}"; do
            echo "Checking coverage for $symbol..."
            
            # Find the most recent window for this symbol
            LATEST_WINDOW=$(aws s3 ls s3://$ACD_S3_BUCKET/$ACD_S3_PREFIX/$symbol/ --recursive | \
              grep "OVERLAP.json" | \
              sort -k1,2 | \
              tail -1 | \
              awk '{print $4}' | \
              sed 's|/OVERLAP.json||')
            
            if [ -n "$LATEST_WINDOW" ]; then
              COVERAGE_KEY="$LATEST_WINDOW/meta/coverage.json"
              echo "Checking: s3://$ACD_S3_BUCKET/$COVERAGE_KEY"
              
              if aws s3 ls "s3://$ACD_S3_BUCKET/$COVERAGE_KEY" >/dev/null 2>&1; then
                echo "✅ Coverage metadata found for $symbol"
                
                # Extract coverage metrics
                COVERAGE_DATA=$(aws s3 cp "s3://$ACD_S3_BUCKET/$COVERAGE_KEY" - 2>/dev/null || echo "{}")
                if [ "$COVERAGE_DATA" != "{}" ]; then
                  echo "📊 Coverage metrics for $symbol:"
                  echo "$COVERAGE_DATA" | jq -r 'to_entries[] | "  \(.key): \(.value.coverage_percentage // "N/A")%"' 2>/dev/null || echo "  (Unable to parse coverage data)"
                fi
              else
                echo "⚠️  WARNING: Coverage metadata missing for $symbol"
                echo "   This may indicate an issue with the enhanced capture script"
                
                if [ "$FAIL_ON_MISSING_COVERAGE" = "true" ]; then
                  echo "❌ FAILING: Coverage validation is now blocking"
                  exit 1
                else
                  echo "⚠️  WARN-ONLY: Coverage validation is non-blocking for now"
                fi
              fi
            else
              echo "⚠️  No windows found for $symbol"
            fi
          done
          
          echo "📈 Health check completed (WARN mode: $FAIL_ON_MISSING_COVERAGE)"
        continue-on-error: true  # non-blocking warning
      
      - name: Upload capture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-logs-${{ github.run_id }}
          path: |
            **/logs/**
            **/reports/**
          retention-days: 7
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Capture failed for run ${{ github.run_number }}"
          echo "Check logs in artifacts for details"
