name: Test Spread v2 Guardrails
on: [push]

jobs:
  test-demo-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install jq for JSON parsing
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Test demo data rejection (should fail)
        id: test_rejection
        continue-on-error: true
        run: |
          set -euxo pipefail
          python scripts/gold_hunt_control_v2.py \
            --snapshot-dir demos/spread_v2_demo/demo_snapshot \
            --export-dir /tmp/test_output_reject \
            --detector zscore \
            --verbose

      - name: Assert demo rejection behaved as expected
        if: ${{ steps.test_rejection.outcome == 'failure' }}
        run: echo "✅ Demo data was rejected (non-zero exit) as expected."

      - name: Assert demo rejection failed (should not happen)
        if: ${{ steps.test_rejection.outcome != 'failure' }}
        run: |
          echo "ERROR: Demo data should be rejected without --allow-demo (expected non-zero exit)." >&2
          exit 1

      - name: Test demo data with --allow-demo (should succeed)
        id: test_allow
        run: |
          set -euxo pipefail
          rm -rf /tmp/test_output && mkdir -p /tmp/test_output
          python scripts/gold_hunt_control_v2.py \
            --snapshot-dir demos/spread_v2_demo/demo_snapshot \
            --export-dir /tmp/test_output \
            --detector zscore \
            --allow-demo \
            --verbose

      - name: Assert demo provenance tagging
        run: |
          set -euxo pipefail
          ls -la /tmp/test_output
          test -f /tmp/test_output/control_v2_results.json
          jq -e '.provenance=="DEMO"' /tmp/test_output/control_v2_results.json >/dev/null
          echo "✅ Provenance tag DEMO present."

      - name: Show last 200 lines of logs on failure
        if: failure()
        run: |
          echo "---- Rejection step outputs ----"
          echo "outcome=${{ steps.test_rejection.outcome }}"
          echo "conclusion=${{ steps.test_rejection.conclusion }}"
          [ -d /tmp/test_output ] && ls -la /tmp/test_output || true
          [ -f /tmp/test_output/control_v2_results.json ] && tail -n 200 /tmp/test_output/control_v2_results.json || true