name: Test Spread v2 Guardrails

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]

jobs:
  test-demo-guardrails:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        # Skip editable install to avoid __init__ package name error
        # pip install -e .
    
    - name: Install jq for JSON parsing
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
    
    - name: Test demo data rejection (should fail)
      id: test_rejection
      continue-on-error: true
      run: |
        python scripts/gold_hunt_control_v2.py \
          --snapshot-dir demos/spread_v2_demo/demo_snapshot \
          --export-dir /tmp/test_output \
          --detector zscore \
          --verbose

    - name: Assert demo rejection behaved as expected
      if: ${{ steps.test_rejection.conclusion == 'failure' }}
      run: echo "✅ Demo data was rejected (non-zero exit) as expected."

    - name: Assert demo rejection failed (should not happen)
      if: ${{ steps.test_rejection.conclusion != 'failure' }}
      run: |
        echo "ERROR: Demo data should be rejected without --allow-demo (expected non-zero exit)." >&2
        exit 1
    
    - name: Test demo data with --allow-demo (should succeed)
      id: test_allow
      run: |
        set -euxo pipefail
        rm -rf /tmp/test_output
        mkdir -p /tmp/test_output

        python scripts/gold_hunt_control_v2.py \
          --snapshot-dir demos/spread_v2_demo/demo_snapshot \
          --export-dir /tmp/test_output \
          --detector zscore \
          --allow-demo \
          --verbose

        echo "Wrote results:"
        ls -la /tmp/test_output
    
    - name: Assert demo provenance tagging
      run: |
        set -euxo pipefail
        test -f /tmp/test_output/control_v2_results.json \
          || (echo "Expected results JSON missing at /tmp/test_output/control_v2_results.json" && exit 1)

        jq -e '.provenance == "DEMO"' /tmp/test_output/control_v2_results.json \
          || (echo "ERROR: provenance must be DEMO" && exit 1)

        echo "✅ Demo provenance is correctly tagged DEMO"
    
    - name: Show last 200 lines of logs on failure
      if: failure()
      run: |
        echo "No additional logs captured; ensure the script prints errors with --verbose."
