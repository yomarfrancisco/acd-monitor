name: Test Spread v2 Guardrails

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]

jobs:
  test-demo-guardrails:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        # Skip editable install to avoid __init__ package name error
        # pip install -e .
    
    - name: Install jq for JSON parsing
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
    
    - name: Test demo data rejection (should fail)
      run: |
        # This should fail with non-zero exit code
        python scripts/gold_hunt_control_v2.py \
          --snapshot-dir demos/spread_v2_demo/demo_snapshot \
          --export-dir /tmp/test_output \
          --detector zscore \
          --verbose
      continue-on-error: true
      id: test_rejection
    
    - name: Assert demo rejection failed
      run: |
        if [ "${{ steps.test_rejection.outcome }}" != "failure" ]; then
          echo "ERROR: Demo data should be rejected without --allow-demo"
          exit 1
        fi
        echo "✅ Demo data correctly rejected without --allow-demo"
    
    - name: Test demo data with --allow-demo (should succeed)
      run: |
        set -euxo pipefail
        rm -rf /tmp/test_output && mkdir -p /tmp/test_output

        # Run the script verbosely; capture non-zero exits
        python scripts/gold_hunt_control_v2.py \
          --snapshot-dir demos/spread_v2_demo/demo_snapshot \
          --export-dir /tmp/test_output \
          --detector zscore \
          --allow-demo \
          --seed 42 \
          --verbose

        echo "== List /tmp/test_output =="
        ls -lah /tmp/test_output
    
    - name: Assert demo provenance tagging
      run: |
        set -euxo pipefail
        # If you keep the current script filename, adjust here:
        RESULTS=/tmp/test_output/control_v2_results.json

        test -f "$RESULTS" || { echo "Expected results file missing at: $RESULTS"; exit 1; }

        # Must contain provenance DEMO (exact match)
        jq -r '.provenance' "$RESULTS" | grep -Fx DEMO
        
        # Must contain regulatory_grade false (exact match)
        jq -r '.regulatory_grade' "$RESULTS" | grep -Fx false
        
        echo "✅ Demo outputs correctly tagged with provenance and regulatory_grade"
    
    - name: Show last 200 lines of logs on failure
      if: failure()
      run: |
        echo "No additional logs captured; ensure the script prints errors with --verbose."
