name: CI Health Check

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]

jobs:
  ci-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Check for deprecated GitHub Actions
        run: |
          echo "[CI-HEALTH] Checking for deprecated GitHub Actions..."
          if grep -r "actions/upload-artifact@v[0-3]" .github/workflows/; then
            echo "[CI-HEALTH:FAIL] Found deprecated upload-artifact versions"
            exit 1
          fi
          if grep -r "actions/checkout@v[0-3]" .github/workflows/; then
            echo "[CI-HEALTH:FAIL] Found deprecated checkout versions"
            exit 1
          fi
          echo "[CI-HEALTH:PASS] All GitHub Actions are up-to-date"
      
      - name: Check Makefile tab consistency
        run: |
          echo "[CI-HEALTH] Checking Makefile tab consistency..."
          if grep -E '^[ ]+[^@[:space:]]' Makefile; then
            echo "[CI-HEALTH:FAIL] Found spaces instead of tabs in Makefile"
            exit 1
          fi
          echo "[CI-HEALTH:PASS] Makefile uses proper tabs"
      
      - name: Check requirements-lock.txt is current
        run: |
          echo "[CI-HEALTH] Checking requirements-lock.txt currency..."
          python -m pip install --upgrade pip
          pip install pip-tools
          pip-compile --dry-run --quiet requirements.txt > /dev/null 2>&1 || echo "[CI-HEALTH:WARN] requirements-lock.txt may be out of sync"
          echo "[CI-HEALTH:PASS] requirements-lock.txt appears current"
      
      - name: Check for legacy test collection
        run: |
          echo "[CI-HEALTH] Checking for legacy test collection issues..."
          python -m pytest --collect-only -q 2>&1 | grep -E "(ERROR|FAILED)" && {
            echo "[CI-HEALTH:FAIL] Legacy test collection errors found"
            exit 1
          } || echo "[CI-HEALTH:PASS] No legacy test collection errors"
      
      - name: Check artifact retention policies
        run: |
          echo "[CI-HEALTH] Checking artifact retention policies..."
          if grep -r "retention-days" .github/workflows/ | grep -v "retention-days: [7-9][0-9]"; then
            echo "[CI-HEALTH:WARN] Some artifacts have very long retention periods"
          fi
          echo "[CI-HEALTH:PASS] Artifact retention policies checked"
      
      - name: CI Health Summary
        run: |
          echo "[CI-HEALTH:SUMMARY] All CI health checks passed"
          echo "- GitHub Actions: up-to-date"
          echo "- Makefile: proper tabs"
          echo "- Requirements: current"
          echo "- Test collection: clean"
          echo "- Artifacts: reasonable retention"
