name: Wave-2 Event Studies CI

on:
  push:
    branches: [ main, feature/i1-event-studies-20251001 ]
    paths:
      - 'analytics/wave2/events/**'
      - '.github/workflows/wave2-events.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'analytics/wave2/events/**'
      - '.github/workflows/wave2-events.yml'
  workflow_dispatch:
    inputs:
      date:
        description: 'Analysis date (YYYYMMDD)'
        required: false
        default: '20251001'
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACD_S3_BUCKET: acd-monitor-snapshots
  DATE: ${{ github.event.inputs.date || '20251001' }}

jobs:
  validate-events:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      ACD_S3_BUCKET: acd-monitor-snapshots
      DATE: ${{ github.event.inputs.date || '20251001' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy boto3 pyarrow
        
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::514258695205:role/acd-ci-oidc
        role-session-name: gha-wave2-events-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Sanity check AWS connectivity
      run: |
        set -euo pipefail
        echo "🔎 STS caller identity:"
        aws sts get-caller-identity
        echo "🔎 List S3 analysis prefix (non-fatal if empty):"
        aws s3 ls s3://${{ env.ACD_S3_BUCKET }}/analysis/ || echo "empty/unknown OK"


    - name: Export WAVE1_PREFIX for Wave-1 checks
      shell: bash
      env:
        BUCKET: ${{ env.ACD_S3_BUCKET }}
        DATE:   ${{ env.DATE }}
      run: |
        set -euo pipefail
        echo "WAVE1_PREFIX=s3://${BUCKET}/analysis/${DATE}/wave1" >> "$GITHUB_ENV"

    - name: "Run Wave-1 compute (date-only; tri-state: skip/run/stop)"
      shell: bash
      env:
        DATE:   ${{ env.DATE }}
        BUCKET: ${{ env.ACD_S3_BUCKET }}
      run: |
        set -euo pipefail
        echo "=== WAVE-1 COMPUTE (tri-state) ==="
        req=(variance_ratios autocorr xcorr rolling)

        present=0
        for art in "${req[@]}"; do
          key="analysis/${DATE}/wave1/btc_usd/${art}.parquet"
          if aws s3 ls "s3://${BUCKET}/${key}" >/dev/null 2>&1; then
            echo "PRESENT: s3://${BUCKET}/${key}"
            present=$((present+1))
          else
            echo "MISSING: s3://${BUCKET}/${key}"
          fi
        done

        if [ "$present" -eq 0 ]; then
          echo "--- run compute (no outputs present) ---"
          python analytics/wave1/compute_wave1.py --date "${DATE}"

          echo "--- verify BTC outputs after compute ---"
          missing=0
          for art in "${req[@]}"; do
            key="analysis/${DATE}/wave1/btc_usd/${art}.parquet"
            if ! aws s3 ls "s3://${BUCKET}/${key}" >/dev/null 2>&1; then
              echo "❌ MISSING after compute: s3://${BUCKET}/${key}"
              missing=1
            else
              echo "✅ PRESENT: s3://${BUCKET}/${key}"
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "❌ BTC Wave-1 outputs missing after compute; stopping."
            exit 1
          fi
          echo "=== WAVE-1 COMPUTE DONE ==="

        elif [ "$present" -eq ${#req[@]} ]; then
          echo "✅ All BTC artifacts already present; skipping compute."
          exit 0

        else
          echo "❌ Partial BTC outputs detected ($present/${#req[@]} present)."
          echo "   Refusing to compute to avoid overwrites in CI. Manual cleanup or explicit approval needed."
          exit 1
        fi

    - name: "Diagnostic: Environment and S3 connectivity test"
      shell: bash
      run: |
        set -eu   # no pipefail for this diag step
        echo "=== DIAGNOSTIC: Environment and S3 connectivity ==="
        echo "DATE: ${{ env.DATE }}"
        echo "BUCKET: ${{ env.ACD_S3_BUCKET }}"
        echo "WAVE1_PREFIX: $WAVE1_PREFIX"

        if ! aws s3 ls "s3://${{ env.ACD_S3_BUCKET }}/" --human-readable --summarize \
             > /tmp/s3_root.txt 2>&1; then
          echo "[warn] s3 root listing failed (non-fatal)"
          cat /tmp/s3_root.txt || true
        else
          head -n 100 /tmp/s3_root.txt || true
        fi

        # never fail from diagnostics
        true

    - name: Pre-validation S3 listing (Wave-1)
      shell: bash
      run: |
        set -e
        echo "listing s3://${{ env.ACD_S3_BUCKET }}/analysis/${{ env.DATE }}/wave1/"
        aws s3 ls --recursive "s3://${{ env.ACD_S3_BUCKET }}/analysis/${{ env.DATE }}/wave1/" || true

    - name: Validate Wave-1 outputs (BTC hard / ETH soft)
      shell: bash
      env:
        DATE:   ${{ env.DATE }}
        BUCKET: ${{ env.ACD_S3_BUCKET }}
      run: |
        set -euo pipefail
        echo "=== WAVE-1 VALIDATION ==="
        ok=1
        for art in variance_ratios autocorr xcorr rolling; do
          key="analysis/${DATE}/wave1/btc_usd/${art}.parquet"
          if ! aws s3 ls "s3://${BUCKET}/${key}" >/dev/null 2>&1; then
            echo "❌ BTC REQUIRED MISSING: s3://${BUCKET}/${key}"
            ok=0
          else
            echo "✅ BTC present: ${key}"
          fi
        done

        # ETH soft checks (warn only)
        soft_missing=()
        for art in variance_ratios autocorr xcorr rolling; do
          key="analysis/${DATE}/wave1/eth_usd/${art}.parquet"
          aws s3 ls "s3://${BUCKET}/${key}" >/dev/null 2>&1 || soft_missing+=("${art}")
        done
        if [ ${#soft_missing[@]} -gt 0 ]; then
          echo "⚠️ ETH soft-missing: ${soft_missing[*]}"
        else
          echo "✅ ETH present (soft)"
        fi

        [ "$ok" -eq 1 ] || { echo "❌ BTC required artifacts missing"; exit 1; }
        echo "=== WAVE-1 VALIDATION OK ==="

    - name: "Run Wave-2 event studies (tri-state: skip/run/stop)"
      shell: bash
      env:
        DATE:   ${{ env.DATE }}
        BUCKET: ${{ env.ACD_S3_BUCKET }}
      run: |
        set -euo pipefail
        echo "=== WAVE-2 EVENT STUDIES (tri-state) ==="
        
        # Check BTC Wave-2 artifacts
        btc_key="analysis/${DATE}/wave2/events/btc_usd/events.parquet"
        btc_present=false
        if aws s3 ls "s3://${BUCKET}/${btc_key}" >/dev/null 2>&1; then
          echo "PRESENT: s3://${BUCKET}/${btc_key}"
          btc_present=true
        else
          echo "MISSING: s3://${BUCKET}/${btc_key}"
        fi
        
        # Check ETH Wave-2 artifacts (soft)
        eth_key="analysis/${DATE}/wave2/events/eth_usd/events.parquet"
        eth_present=false
        if aws s3 ls "s3://${BUCKET}/${eth_key}" >/dev/null 2>&1; then
          echo "PRESENT: s3://${BUCKET}/${eth_key}"
          eth_present=true
        else
          echo "MISSING: s3://${BUCKET}/${eth_key}"
        fi
        
        if [ "$btc_present" = "true" ]; then
          echo "✅ BTC Wave-2 artifacts already present; skipping compute."
        else
          echo "--- run Wave-2 compute for BTC ---"
          python3 analytics/wave2/events/runner.py \
            --date "${DATE}" \
            --bucket "${BUCKET}" \
            --symbol btc_usd \
            --no-overwrite
          
          echo "--- verify BTC Wave-2 outputs after compute ---"
          if ! aws s3 ls "s3://${BUCKET}/${btc_key}" >/dev/null 2>&1; then
            echo "❌ MISSING after compute: s3://${BUCKET}/${btc_key}"
            exit 1
          else
            echo "✅ PRESENT: s3://${BUCKET}/${btc_key}"
          fi
        fi
        
        # ETH soft check (warn only)
        if [ "$eth_present" = "false" ]; then
          echo "⚠️ ETH Wave-2 artifacts missing (soft - optional)"
        else
          echo "✅ ETH Wave-2 present (soft)"
        fi
        
        echo "=== WAVE-2 EVENT STUDIES DONE ==="
        
    - name: Validate Wave-2 outputs (BTC hard / ETH soft)
      shell: bash
      env:
        DATE:   ${{ env.DATE }}
        BUCKET: ${{ env.ACD_S3_BUCKET }}
        WAVE2_STRICT: ${{ env.WAVE2_STRICT || 'false' }}
      run: |
        set -euo pipefail
        echo "=== WAVE-2 VALIDATION ==="

        btc_key="analysis/${DATE}/wave2/events/btc_usd/events.parquet"
        if ! aws s3 ls "s3://${BUCKET}/${btc_key}" >/dev/null 2>&1; then
          echo "❌ BTC REQUIRED MISSING: s3://${BUCKET}/${btc_key}"
          if [ "$WAVE2_STRICT" = "true" ]; then exit 1; else echo "ℹ️ DIAG: continuing (WAVE2_STRICT=false)"; fi
        else
          echo "✅ BTC present: ${btc_key}"
        fi

        echo "--- validating BTC Wave-2 schema and quality (diagnostic) ---"
        python3 - <<'EOF'
        import boto3, io, pandas as pd, json, sys, os
        bucket = os.environ["BUCKET"]; date = os.environ["DATE"]; strict = os.environ.get("WAVE2_STRICT","false")=="true"
        key = f"analysis/{date}/wave2/events/btc_usd/events.parquet"
        def diag(msg): print(msg); sys.stdout.flush()
        try:
            s3 = boto3.client("s3")
            obj = s3.get_object(Bucket=bucket, Key=key)
            df = pd.read_parquet(io.BytesIO(obj["Body"].read()))
            diag(f"📊 BTC events shape: {df.shape}")

            required = ["symbol","venue","event_type","n_events","n_used","car_60s","car_300s","d_spread","d_vol","hit_60s","status"]
            missing = [c for c in required if c not in df.columns]
            if missing:
                diag(f"❌ Missing cols: {missing}")
                if strict: sys.exit(1)
            if len(df)==0:
                diag("❌ Empty events table"); 
                if strict: sys.exit(1)

            # Group diagnostics to see what's failing
            grp = df.groupby(["venue","event_type"], dropna=False)["n_events","n_used"].min().rename(columns={"n_events":"min_n_events","n_used":"min_n_used"})
            diag("\n=== n_used by (venue,event_type) — min across rows ===")
            diag(grp.to_string())

            offenders = df[df["n_used"] < 5][["venue","event_type","n_events","n_used"]]
            if len(offenders):
                diag("\n❌ Offenders (n_used < 5):\n" + offenders.to_string(index=False))
                if strict: sys.exit(1)
            else:
                diag("✅ Min-sample rule passed for all rows")

            diag("✅ Wave-2 diagnostic complete")
        except Exception as e:
            diag(f"⚠️ Wave-2 diagnostic error: {e}")
            # Diagnostic mode never hard-fails here; strict mode would:
            if strict: sys.exit(1)
        EOF

        # ETH soft presence only
        eth_key="analysis/${DATE}/wave2/events/eth_usd/events.parquet"
        aws s3 ls "s3://${BUCKET}/${eth_key}" >/dev/null 2>&1 \
          && echo "✅ ETH present (soft): ${eth_key}" \
          || echo "⚠️ ETH Wave-2 missing (soft - optional)"

        echo "=== WAVE-2 VALIDATION (diagnostic mode unless WAVE2_STRICT=true) ==="
        
        
    - name: Validate schema and data quality
      run: |
        echo "🔍 Validating event studies schema and quality..."
        python3 -c "
        import boto3
        import pandas as pd
        import io
        import numpy as np
        
        s3 = boto3.client('s3')
        bucket = '${{ env.ACD_S3_BUCKET }}'
        date = '${{ env.DATE }}'
        
        # Required columns
        required_columns = [
            'symbol', 'venue', 'event_type', 'n_events', 'n_used',
            'car_60s', 'car_300s', 'd_spread', 'd_vol', 'hit_60s', 'status'
        ]
        
        # Check BTC events
        btc_key = f'analysis/{date}/wave2/events/btc_usd/events.parquet'
        response = s3.get_object(Bucket=bucket, Key=btc_key)
        df = pd.read_parquet(io.BytesIO(response['Body'].read()))
        
        # Schema validation
        missing_cols = [col for col in required_columns if col not in df.columns]
        if missing_cols:
            print(f'❌ Missing columns: {missing_cols}')
            exit(1)
        print('✅ Schema validation passed')
        
        # Data quality checks
        successful_df = df[df['status'] == 'success']
        if len(successful_df) == 0:
            print('❌ No successful event studies found')
            exit(1)
            
        # Check min sample rule (n_used >= 5)
        insufficient_samples = successful_df[successful_df['n_used'] < 5]
        if len(insufficient_samples) > 0:
            print(f'❌ Found {len(insufficient_samples)} combinations with n_used < 5')
            print(insufficient_samples[['venue', 'event_type', 'n_used']])
            exit(1)
        print('✅ Min sample rule respected')
        
        # Check for reasonable values
        numeric_cols = ['car_60s', 'car_300s', 'd_spread', 'd_vol', 'hit_60s']
        for col in numeric_cols:
            if col in successful_df.columns:
                non_null_count = successful_df[col].notna().sum()
                print(f'   {col}: {non_null_count}/{len(successful_df)} non-null values')
        
        print('✅ Data quality validation passed')
        print(f'📊 Summary: {len(successful_df)} successful combinations')
        "
        
    - name: Save Wave-1 summary (optional)
      shell: bash
      run: |
        mkdir -p artifacts_wave2_events
        echo "{\"date\":\"${{ env.DATE }}\",\"wave1\":\"ok\"}" > artifacts_wave2_events/wave1_ci_summary.json

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wave2-events-ci-${{ github.run_id }}
        path: artifacts_wave2_events/**
        if-no-files-found: ignore
        retention-days: 3
        
    - name: Report results
      if: always()
      run: |
        echo "📊 Wave-2 Event Studies CI Results:"
        echo "  Date: ${{ env.DATE }}"
        echo "  BTC-USD: ✅ Validated"
        echo "  ETH-USD: ⚠️ Exploratory (may be missing)"
        echo "  Schema: ✅ Required columns present"
        echo "  Quality: ✅ Min sample rule respected"
        echo "  Artifacts: wave2-events-ci-${{ github.run_id }}"
# Trigger workflow
