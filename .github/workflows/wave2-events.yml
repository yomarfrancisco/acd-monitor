name: Wave-2 Event Studies CI

on:
  push:
    branches: [ main, feature/i1-event-studies-20251001 ]
    paths:
      - 'analytics/wave2/events/**'
      - '.github/workflows/wave2-events.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'analytics/wave2/events/**'
      - '.github/workflows/wave2-events.yml'
  workflow_dispatch:
    inputs:
      date:
        description: 'Analysis date (YYYYMMDD)'
        required: false
        default: '20251001'
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ACD_S3_BUCKET: acd-monitor-snapshots
  DATE: ${{ github.event.inputs.date || '20251001' }}

jobs:
  validate-events:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      ACD_S3_BUCKET: acd-monitor-snapshots
      DATE: ${{ github.event.inputs.date || '20251001' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy boto3 pyarrow
        
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::514258695205:role/acd-ci-oidc
        role-session-name: gha-wave2-events-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Sanity check AWS connectivity
      run: |
        set -euo pipefail
        echo "🔎 STS caller identity:"
        aws sts get-caller-identity
        echo "🔎 List S3 analysis prefix (non-fatal if empty):"
        aws s3 ls s3://${{ env.ACD_S3_BUCKET }}/analysis/ || echo "empty/unknown OK"

    - name: Validate Wave-1 artifacts exist (BTC required, ETH soft)
      shell: bash
      run: |
        set -euo pipefail
        DATE="${{ env.DATE }}"
        BUCKET="${{ env.ACD_S3_BUCKET }}"

        check_symbol () {
          local sym="$1"
          local strict="$2"  # "strict" or "soft"
          missing=()

          for art in variance_ratios autocorr xcorr rolling; do
            if ! aws s3 ls "s3://${BUCKET}/analysis/${DATE}/wave1/${sym}/${art}.parquet" >/dev/null 2>&1; then
              missing+=("${art}")
            fi
          done

          # PCA optional
          if ! aws s3 ls "s3://${BUCKET}/analysis/${DATE}/wave1/${sym}/pca.parquet" >/dev/null 2>&1; then
            echo "ℹ️ ${sym}: pca.parquet absent (optional)"
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            if [ "${strict}" = "strict" ]; then
              echo "❌ ${sym}: missing Wave-1 artifacts: ${missing[*]}"
              exit 1
            else
              echo "⚠️ ${sym}: missing Wave-1 artifacts (soft): ${missing[*]}"
            fi
          else
            echo "✅ ${sym}: all required Wave-1 artifacts present"
          fi
        }

        check_symbol "btc_usd" "strict"
        check_symbol "eth_usd" "soft" || true

    - name: Compute Wave-1 (BTC required if missing; ETH soft) — DIAGNOSTIC
      shell: bash
      run: |
        set -euo pipefail
        DATE="${{ env.DATE }}"
        BUCKET="${{ env.ACD_S3_BUCKET }}"
        ALLOW_OVERWRITE="${ALLOW_OVERWRITE:-false}"
        REGION="${{ env.AWS_REGION }}"

        ensure_symbol () {
          local sym="$1"
          local strict="$2"  # "strict" or "soft"

          need_compute="false"
          echo "--- DIAGNOSTIC: checking Wave-1 artifacts for ${sym} @ s3://${BUCKET}/analysis/${DATE}/wave1/${sym}/ ---"
          for art in variance_ratios autocorr xcorr rolling; do
            key="analysis/${DATE}/wave1/${sym}/${art}.parquet"
            echo "DIAG: aws s3 ls s3://${BUCKET}/${key}"
            if ! aws s3 ls "s3://${BUCKET}/${key}" >/dev/null 2>&1; then
              echo "DIAG: ${art} = MISSING"
              need_compute="true"
            else
              echo "DIAG: ${art} = PRESENT"
            fi
          done

          if [ "${need_compute}" = "true" ]; then
            if [ "${ALLOW_OVERWRITE}" != "false" ]; then
              echo "❌ ALLOW_OVERWRITE must be false in CI"; exit 1
            fi
            echo "DIAG: running compute_wave1.py for ${sym}"
            python analytics/wave1/compute_wave1.py --date "${DATE}" --symbol "${sym}"

            echo "DIAG: verifying outputs for ${sym} after compute"
            aws s3 ls "s3://${BUCKET}/analysis/${DATE}/wave1/${sym}/" || true
          else
            echo "DIAG: all required artifacts already present; skipping compute for ${sym}"
          fi
          echo "--- DIAGNOSTIC DONE: ${sym} ---"
        }

        ensure_symbol "btc_usd" "strict"
        ensure_symbol "eth_usd" "soft" || true

    - name: Export WAVE1_PREFIX for Wave-1 checks
      shell: bash
      env:
        BUCKET: ${{ env.ACD_S3_BUCKET }}
        DATE:   ${{ env.DATE }}
      run: |
        set -euo pipefail
        echo "WAVE1_PREFIX=s3://${BUCKET}/analysis/${DATE}/wave1" >> "$GITHUB_ENV"

    - name: Validate Wave-1 data quality (schema-aware)
      shell: bash
      run: |
        set -euxo pipefail
        python analytics/wave1/validate_wave1_ci.py

    - name: Run BTC event-studies (safe, no overwrite)
      run: |
        python3 analytics/wave2/events/runner.py \
          --date "${{ env.DATE }}" \
          --bucket "${{ env.ACD_S3_BUCKET }}" \
          --symbol btc_usd \
          --no-overwrite
        
    - name: Validate BTC events exist
      run: |
        echo "🔍 Checking BTC-USD event studies..."
        python3 -c "
        import boto3
        import pandas as pd
        import io
        
        s3 = boto3.client('s3')
        bucket = '${{ env.ACD_S3_BUCKET }}'
        date = '${{ env.DATE }}'
        
        # Check BTC events file
        btc_key = f'analysis/{date}/wave2/events/btc_usd/events.parquet'
        try:
            response = s3.get_object(Bucket=bucket, Key=btc_key)
            df = pd.read_parquet(io.BytesIO(response['Body'].read()))
            print(f'✅ BTC events: {len(df)} rows')
            print(f'   Columns: {list(df.columns)}')
            print(f'   Venues: {df[\"venue\"].unique().tolist()}')
            print(f'   Event types: {df[\"event_type\"].unique().tolist()}')
            print(f'   Status: {df[\"status\"].value_counts().to_dict()}')
        except Exception as e:
            print(f'❌ BTC events missing: {e}')
            exit(1)
        "
        
    - name: Validate ETH events (soft check)
      run: |
        echo "🔍 Checking ETH-USD event studies..."
        python3 -c "
        import boto3
        import pandas as pd
        import io
        
        s3 = boto3.client('s3')
        bucket = '${{ env.ACD_S3_BUCKET }}'
        date = '${{ env.DATE }}'
        
        # Check ETH events file (soft check)
        eth_key = f'analysis/{date}/wave2/events/eth_usd/events.parquet'
        try:
            response = s3.get_object(Bucket=bucket, Key=eth_key)
            df = pd.read_parquet(io.BytesIO(response['Body'].read()))
            print(f'✅ ETH events: {len(df)} rows')
            print(f'   Columns: {list(df.columns)}')
            print(f'   Venues: {df[\"venue\"].unique().tolist()}')
            print(f'   Event types: {df[\"event_type\"].unique().tolist()}')
            print(f'   Status: {df[\"status\"].value_counts().to_dict()}')
        except Exception as e:
            print(f'⚠️ ETH events missing (expected for exploratory): {e}')
        "
        
    - name: Validate schema and data quality
      run: |
        echo "🔍 Validating event studies schema and quality..."
        python3 -c "
        import boto3
        import pandas as pd
        import io
        import numpy as np
        
        s3 = boto3.client('s3')
        bucket = '${{ env.ACD_S3_BUCKET }}'
        date = '${{ env.DATE }}'
        
        # Required columns
        required_columns = [
            'symbol', 'venue', 'event_type', 'n_events', 'n_used',
            'car_60s', 'car_300s', 'd_spread', 'd_vol', 'hit_60s', 'status'
        ]
        
        # Check BTC events
        btc_key = f'analysis/{date}/wave2/events/btc_usd/events.parquet'
        response = s3.get_object(Bucket=bucket, Key=btc_key)
        df = pd.read_parquet(io.BytesIO(response['Body'].read()))
        
        # Schema validation
        missing_cols = [col for col in required_columns if col not in df.columns]
        if missing_cols:
            print(f'❌ Missing columns: {missing_cols}')
            exit(1)
        print('✅ Schema validation passed')
        
        # Data quality checks
        successful_df = df[df['status'] == 'success']
        if len(successful_df) == 0:
            print('❌ No successful event studies found')
            exit(1)
            
        # Check min sample rule (n_used >= 5)
        insufficient_samples = successful_df[successful_df['n_used'] < 5]
        if len(insufficient_samples) > 0:
            print(f'❌ Found {len(insufficient_samples)} combinations with n_used < 5')
            print(insufficient_samples[['venue', 'event_type', 'n_used']])
            exit(1)
        print('✅ Min sample rule respected')
        
        # Check for reasonable values
        numeric_cols = ['car_60s', 'car_300s', 'd_spread', 'd_vol', 'hit_60s']
        for col in numeric_cols:
            if col in successful_df.columns:
                non_null_count = successful_df[col].notna().sum()
                print(f'   {col}: {non_null_count}/{len(successful_df)} non-null values')
        
        print('✅ Data quality validation passed')
        print(f'📊 Summary: {len(successful_df)} successful combinations')
        "
        
    - name: Save Wave-1 summary (optional)
      shell: bash
      run: |
        mkdir -p artifacts_wave2_events
        echo "{\"date\":\"${{ env.DATE }}\",\"wave1\":\"ok\"}" > artifacts_wave2_events/wave1_ci_summary.json

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wave2-events-ci-${{ github.run_id }}
        path: artifacts_wave2_events/**
        if-no-files-found: ignore
        retention-days: 3
        
    - name: Report results
      if: always()
      run: |
        echo "📊 Wave-2 Event Studies CI Results:"
        echo "  Date: ${{ env.DATE }}"
        echo "  BTC-USD: ✅ Validated"
        echo "  ETH-USD: ⚠️ Exploratory (may be missing)"
        echo "  Schema: ✅ Required columns present"
        echo "  Quality: ✅ Min sample rule respected"
        echo "  Artifacts: wave2-events-ci-${{ github.run_id }}"
# Trigger workflow
