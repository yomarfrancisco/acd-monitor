name: ICP-VMM Analysis

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      window_id:
        description: 'Window ID to analyze'
        required: false
        default: 'latest'

# Ensure only one analysis runs at a time
concurrency:
  group: icp-vmm-analysis-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ACD_S3_BUCKET: acd-monitor-snapshots
  ACD_S3_PREFIX: analysis

jobs:
  icp-vmm-analysis:
    # 15 minute timeout
    timeout-minutes: 15
    
    runs-on: ubuntu-latest
    
    # Only run on main branch
    if: ${{ github.ref == 'refs/heads/main' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit SHA
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Run ICP-VMM Analysis
        run: |
          # Find latest BTC-USD window
          LATEST_WINDOW=$(aws s3 ls s3://acd-monitor-snapshots/snapshots/BTC-USD/ --recursive | \
            grep "OVERLAP.json" | \
            sort -k1,2 | \
            tail -1 | \
            awk '{print $4}' | \
            sed 's|/OVERLAP.json||')
          
          if [ -z "$LATEST_WINDOW" ]; then
            echo "No BTC-USD windows found"
            exit 1
          fi
          
          echo "Analyzing window: $LATEST_WINDOW"
          
          # Run ICP-VMM analysis
          python scripts/icp_vmm/test_refined_icp_vmm.py
          
          # Find output directory
          OUTPUT_DIR=$(find /tmp -name "icp_vmm_output_*" -type d | head -1)
          if [ -z "$OUTPUT_DIR" ]; then
            echo "No output directory found"
            exit 1
          fi
          
          echo "Output directory: $OUTPUT_DIR"
          
          # Run CI checks
          echo "🧪 Running CI checks..."
          
          # Schema validation
          echo "   Validating MANIFEST.json schema..."
          python scripts/icp_vmm/schema_validator.py "$OUTPUT_DIR/MANIFEST.json"
          
          # Determinism test
          echo "   Testing determinism..."
          python scripts/icp_vmm/determinism_test.py
          
          # Evidence integrity test
          echo "   Testing evidence integrity..."
          python scripts/icp_vmm/evidence_integrity_test.py "$OUTPUT_DIR"
          
          echo "✅ All CI checks passed"
      
      - name: Upload MANIFEST as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icp-vmm-manifest-${{ github.run_id }}
          path: /tmp/icp_vmm_output_*/MANIFEST.json
          retention-days: 30
      
      - name: Upload EVIDENCE as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icp-vmm-evidence-${{ github.run_id }}
          path: /tmp/icp_vmm_output_*/EVIDENCE.md
          retention-days: 30
      
      - name: Upload LIMITATIONS as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icp-vmm-limitations-${{ github.run_id }}
          path: /tmp/icp_vmm_output_*/LIMITATIONS.md
          retention-days: 30
      
      - name: Upload SUMMARY as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icp-vmm-summary-${{ github.run_id }}
          path: /tmp/icp_vmm_output_*/SUMMARY.md
          retention-days: 30
      
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the latest output directory
            const outputDir = '/tmp/icp_vmm_output_*';
            const files = fs.readdirSync('/tmp').filter(f => f.startsWith('icp_vmm_output_'));
            
            if (files.length > 0) {
              const latestDir = `/tmp/${files[files.length - 1]}`;
              
              // Read summary
              const summaryPath = path.join(latestDir, 'SUMMARY.md');
              if (fs.existsSync(summaryPath)) {
                const summary = fs.readFileSync(summaryPath, 'utf8');
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `## ICP-VMM Analysis Results\n\n\`\`\`\n${summary}\n\`\`\``
                });
              }
            }
