name: ci

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'baseline/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'baseline/**'
      - 'fix/**'
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'
              - 'package.json'
              - 'package-lock.json'
            backend:
              - 'src/**'
              - 'tests/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'openapi/**'
              - '.flake8'
              - 'pyproject.toml'
              - 'setup.cfg'

  ui:
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile=false

      - name: Install UI package deps
        run: pnpm --filter ./ui/cursor-dashboard install --frozen-lockfile=false

      - name: Verify UI deps
        run: pnpm --filter ./ui/cursor-dashboard ls zod react react-dom || true

      - name: Typecheck
        run: pnpm --filter ./ui/cursor-dashboard run typecheck

      - name: Build
        run: pnpm --filter ./ui/cursor-dashboard run build

      - name: Verify static assets
        run: |
          echo "📁 Listing public directory contents:"
          ls -la ui/cursor-dashboard/public
          echo ""
          echo "🔍 Checking for exchange logo files:"
          for f in binance_circle.png coinbase_circle.png bybit_circle.png kraken_circle.png; do
            if test -f "ui/cursor-dashboard/public/$f"; then
              echo "✅ Found: $f"
            else
              echo "❌ Missing: $f"
              exit 1
            fi
          done
          echo "✅ All exchange logo files present"

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Install lint tools (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "black==24.8.0" "flake8==7.1.0"
          python - <<'PY'
          import black, sys
          print("CI black", black.__version__)
          print("Python", sys.version.split()[0])
          PY

      - name: Lint with flake8
        run: flake8 backend src

      - name: Black check
        run: black --config pyproject.toml --check --diff backend src

  ci-aws-audit:
    name: CI AWS Audit
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # ok even if not using OIDC; harmless
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pyarrow pandas

      - name: Capture commit short sha
        id: meta
        run: |
          echo "shortsha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Make output dir
        run: |
          OUT="analysis/infra/CI_AUDIT/${{ steps.meta.outputs.shortsha }}"
          mkdir -p "$OUT"
          echo "$OUT" > ci_audit_outdir.txt

      - name: Audit: environment surface (minimal)
        run: |
          OUT=$(cat ci_audit_outdir.txt)
          python - << 'PY'
import json, os, platform
env = {
  "platform": platform.platform(),
  "python": platform.python_version(),
  "has_AWS_ACCESS_KEY_ID": "AWS_ACCESS_KEY_ID" in os.environ,
  "has_AWS_SECRET_ACCESS_KEY": "AWS_SECRET_ACCESS_KEY" in os.environ,
  "AWS_REGION": os.environ.get("AWS_REGION") or os.environ.get("AWS_DEFAULT_REGION")
}
print(json.dumps(env, indent=2))
open(f"{open('ci_audit_outdir.txt').read().strip()}/ENV.json","w").write(json.dumps(env, indent=2))
PY

      - name: Audit: STS identity
        run: |
          OUT=$(cat ci_audit_outdir.txt)
          aws sts get-caller-identity > "$OUT/STS.json"

      - name: Audit: S3 list (top-level)
        env:
          S3_BUCKET: acd-monitor-snapshots
        run: |
          OUT=$(cat ci_audit_outdir.txt)
          set -e
          echo "Listing s3://$S3_BUCKET/snapshots/BTC-USD/ ..." | tee "$OUT/S3_LIST.txt"
          aws s3 ls "s3://$S3_BUCKET/snapshots/BTC-USD/" --recursive --human-readable --summarize >> "$OUT/S3_LIST.txt"

      - name: Audit: Parquet head (via PyArrow)
        env:
          S3_BUCKET: acd-monitor-snapshots
        run: |
          OUT=$(cat ci_audit_outdir.txt)
          python - << 'PY'
import os, json
import pyarrow.parquet as pq
import pyarrow.fs as fs

bucket = os.environ["S3_BUCKET"]
# find a parquet path we expect to exist (adjust if needed)
candidate_prefix = "snapshots/BTC-USD"
s3 = fs.S3FileSystem()
# List a few candidates and pick the first .parquet
files = []
for de in s3.get_file_info(fs.FileSelector(f"{bucket}/{candidate_prefix}", recursive=True)):
    if de.type == fs.FileType.File and de.path.endswith(".parquet"):
        files.append(de.path)
        if len(files) >= 10: break

out = {"tested_files": files, "sample": None, "error": None}
try:
    if files:
        # open the first parquet file
        table = pq.read_table(f"s3://{files[0]}", filesystem=s3, columns=None)
        df = table.to_pandas().head(5)
        # ensure json serializable
        out["sample"] = {
            "columns": list(df.columns),
            "rows": df.astype(object).where(df.notna(), None).to_dict(orient="records")
        }
    else:
        out["error"] = "No parquet files found under prefix."
except Exception as e:
    out["error"] = str(e)

with open(open('ci_audit_outdir.txt').read().strip()+"/PARQUET_HEAD.json","w") as f:
    json.dump(out, f, indent=2)
PY

      - name: Write human summary
        run: |
          OUT=$(cat ci_audit_outdir.txt)
          SUMMARY="$OUT/SUMMARY.md"
          echo "# CI AWS Audit Summary" > "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "- Commit: \`${{ steps.meta.outputs.shortsha }}\`" >> "$SUMMARY"
          echo "- Region: \`${{ secrets.AWS_DEFAULT_REGION }}\`" >> "$SUMMARY"
          echo "- Bucket: \`acd-monitor-snapshots\`" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "## Artifacts" >> "$SUMMARY"
          echo "- ENV.json" >> "$SUMMARY"
          echo "- STS.json" >> "$SUMMARY"
          echo "- S3_LIST.txt" >> "$SUMMARY"
          echo "- PARQUET_HEAD.json" >> "$SUMMARY"

      - name: Commit CI audit artifacts
        if: always()
        run: |
          OUT=$(cat ci_audit_outdir.txt)
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add "$OUT" || true
          git commit -m "chore(ci-audit): add CI AWS audit artifacts for ${{ steps.meta.outputs.shortsha }}" || echo "No changes"
          git push || true
