name: ci

on:
  push:
    branches:
      - main
      - feat/**      # run CI on feature branches too
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'
              - 'package.json'
              - 'package-lock.json'
            backend:
              - 'src/**'
              - 'tests/**'
              - 'schemas/**'
              - 'scripts/**'
              - 'openapi/**'
              - '.flake8'
              - 'pyproject.toml'
              - 'setup.cfg'

  ui:
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/cursor-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/cursor-dashboard/package-lock.json

      - name: Install deps (ci with fallback)
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Contract Tests
        run: npm run contracts

      - name: Build
        run: npm run build

      - name: Verify static assets
        run: test -d .next/static/css && test -d .next/static/chunks/app

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Install lint tools
        run: |
          pip install "black==24.8.0" "flake8==7.1.0" "isort==5.13.2"

      - name: Format check with black
        run: black --check --diff .

      - name: Lint with flake8
        run: |
          set -euo pipefail
          shopt -s nullglob
          EXISTING=()
          while IFS= read -r pat; do
            # skip blanks/comments
            [[ -z "$pat" || "$pat" =~ ^# ]] && continue
            matches=($pat)
            if (( ${#matches[@]} )); then
              EXISTING+=("${matches[@]}")
            fi
          done < lint-allowlist.txt
          shopt -u nullglob

          if (( ${#EXISTING[@]} == 0 )); then
            echo "No matching allowlisted paths; skipping flake8."
            exit 0
          fi
          echo "Linting ${#EXISTING[@]} path(s): ${EXISTING[*]}"
          flake8 "${EXISTING[@]}"