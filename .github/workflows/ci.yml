name: ci

on:
  push:
    branches: [ main, feat/** ]
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - ".flake8"
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - ".flake8"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install black==24.8.0 flake8==7.1.1 flake8-bugbear==24.4.26
      - name: Lint with flake8
        run: |
          flake8 src scripts
      - name: Format check with black
        run: |
          black --check src scripts