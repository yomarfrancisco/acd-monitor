[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false
extend-exclude = '''
(
  ^.*/_archived/.*|
  ^.*/_snapshots/.*|
  ^.*/_generated/.*|
  ^.*/dist/.*|
  ^.*/build/.*
)
'''

[tool.isort]
profile = "black"
line_length = 100
py_version = 311
skip = ["_archived", "_snapshots", "_generated", "dist", "build"]